name: Console V2 (Windows x64)

on:
  push:
    paths:
      - 'apps/console-v2/**'
      - '.github/workflows/console-v2.yml'
  pull_request:
    paths:
      - 'apps/console-v2/**'
      - '.github/workflows/console-v2.yml'

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/console-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/console-v2/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/console-v2 -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/console-v2/sidecar/linkerhand-bridge/pyproject.toml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sidecar test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tauri shell check
        run: cargo check -p linkerhand-console

      - name: Python sidecar tests
        run: python -m pytest -q
        working-directory: apps/console-v2/sidecar/linkerhand-bridge

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Boundary fixture tests
        run: pnpm test:boundaries

      - name: Contracts
        run: pnpm check:contracts

      - name: Offline vision assets
        run: pnpm check:vision-assets

      - name: Dependency boundaries
        run: pnpm check:boundaries

      - name: Frontend build
        run: pnpm build
