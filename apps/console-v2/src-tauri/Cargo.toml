[package]
name = "linkerhand-console"
version.workspace = true
edition.workspace = true
[lib]
name = "linkerhand_console_lib"
crate-type = ["lib", "cdylib", "staticlib"]
[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
console-contracts = { path = "../crates/console-contracts" }
app-runtime = { path = "../crates/app-runtime" }
sidecar-client = { path = "../crates/sidecar-client" }
adaptive-grasp = { path = "../crates/adaptive-grasp" }
action-engine = { path = "../crates/action-engine" }
tokio = { version = "1", features = ["sync"] }
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dev-dependencies]
device-adapter-api = { path = "../crates/device-adapter-api" }
device-simulator = { path = "../crates/device-simulator" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com"] }
