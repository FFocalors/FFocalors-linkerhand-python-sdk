[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkerhand-console-sidecar"
version = "0.1.0"
description = "NDJSON Python SDK sidecar for LinkerHand Console V2"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
