[workspace]
resolver = "2"
members = [
  "crates/console-contracts",
  "crates/device-adapter-api",
  "crates/device-simulator",
  "crates/telemetry",
  "crates/structured-logging",
  "crates/sidecar-client",
  "crates/motion-engine",
  "crates/device-runtime",
  "crates/action-engine",
  "crates/adaptive-grasp",
  "crates/app-runtime",
  "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
debug = 1
